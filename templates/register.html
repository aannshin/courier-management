<!DOCTYPE html>
<html>

<head>
    <title>Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="navbar">
        <h2>Courier Management System</h2>
    </div>

    <div class="hero">

        <h1>Create Account</h1>

        <form method="POST">

            <input type="text"
                   name="name"
                   placeholder="Your Name"
                   required>

            <br><br>

            <input type="email"
                   name="email"
                   placeholder="Email"
                   required>

            <br><br>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <br><br>

            <button type="submit" class="btn">
                Register
            </button>

        </form>

        <p>
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>

</body>

</html>
